<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Challenge</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        .instruction {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .display-area {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        #targetChar {
            font-size: 4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        /* 입력 피드백 애니메이션 효과 */
        .display-area.correct {
            border-color: var(--correct-color);
            background: rgba(34, 197, 94, 0.1);
        }

        .display-area.wrong {
            border-color: var(--wrong-color);
            background: rgba(239, 68, 68, 0.1);
            animation: shake 0.2s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
        }

        button {
            flex: 1;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #startButton {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        #startButton:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        #resetButton {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        #resetButton:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        #statusMessage {
            margin-top: 1rem;
            font-size: 0.875rem;
            height: 1.25rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>타자 속도 측정</h1>
        <p class="instruction">화면에 표시되는 문자를 빠르게 입력하세요 (대소문자 구분)</p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">점수</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">남은 시간</div>
                <div class="stat-value" id="timer">20s</div>
            </div>
        </div>

        <div class="display-area" id="displayArea">
            <div id="targetChar">-</div>
        </div>

        <div class="button-group">
            <button id="startButton" onclick="startGame()">게임 시작</button>
            <button id="resetButton" onclick="resetGame()">초기화</button>
        </div>

        <div id="statusMessage">시작 버튼을 눌러주세요</div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 20;
        let gameInterval = null;
        let isGameRunning = false;

        const targetCharElement = document.getElementById('targetChar');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const displayArea = document.getElementById('displayArea');
        const startButton = document.getElementById('startButton');
        const statusMessage = document.getElementById('statusMessage');

        function getRandomChar() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function setNewTargetChar() {
            targetCharElement.innerText = getRandomChar();
        }

        function triggerFeedback(type) {
            displayArea.classList.remove('correct', 'wrong');
            void displayArea.offsetWidth; // Reflow 발생시켜 애니메이션 리셋
            displayArea.classList.add(type);
            
            setTimeout(() => {
                displayArea.classList.remove('correct', 'wrong');
            }, 200);
        }

        function checkInput(event) {
            // 시스템 단축키 및 기능키 제외
            if (event.key.length > 1) return;

            const inputChar = event.key;
            
            if (inputChar === targetCharElement.innerText) {
                score += 10;
                triggerFeedback('correct');
            } else {
                score = Math.max(0, score - 5); // 점수가 음수로 내려가지 않도록 제어
                triggerFeedback('wrong');
            }

            scoreElement.innerText = score;
            setNewTargetChar();
        }

        function updateTimer() {
            timeLeft--;
            timerElement.innerText = `${timeLeft}s`;

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function endGame() {
            clearInterval(gameInterval);
            document.removeEventListener('keydown', checkInput);
            
            isGameRunning = false;
            startButton.disabled = false;
            targetCharElement.innerText = '-';
            statusMessage.innerText = `게임 종료! 최종 점수: ${score}점`;
        }

        function startGame() {
            if (isGameRunning) return;
            
            isGameRunning = true;
            startButton.disabled = true;
            score = 0;
            timeLeft = 20;
            
            scoreElement.innerText = score;
            timerElement.innerText = `${timeLeft}s`;
            statusMessage.innerText = '키보드로 문자를 입력하세요!';
            
            setNewTargetChar();

            gameInterval = setInterval(updateTimer, 1000);
            document.addEventListener('keydown', checkInput);
        }

        function resetGame() {
            clearInterval(gameInterval);
            document.removeEventListener('keydown', checkInput);
            
            isGameRunning = false;
            startButton.disabled = false;
            score = 0;
            timeLeft = 20;
            
            scoreElement.innerText = '0';
            timerElement.innerText = '20s';
            targetCharElement.innerText = '-';
            statusMessage.innerText = '시작 버튼을 눌러주세요';
        }
    </script>
</body>
</html>
