<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Challenge</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
            --inner-bg: rgba(0, 0, 0, 0.2);
            --card-border: rgba(255, 255, 255, 0.05);
            --modal-bg: rgba(0, 0, 0, 0.7);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --correct-color: #16a34a;
            --wrong-color: #dc2626;
            --inner-bg: #f8fafc;
            --card-border: rgba(0, 0, 0, 0.08);
            --modal-bg: rgba(15, 23, 42, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--card-border);
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--inner-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-toggle-btn:hover {
            opacity: 0.8;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
            margin-top: 0.5rem;
        }

        .instruction {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .time-select-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--inner-bg);
            padding: 0.35rem;
            border-radius: 12px;
        }

        .time-btn {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-sub);
            cursor: pointer;
        }

        .time-btn:hover:not(:disabled) {
            color: var(--text-main);
        }

        .time-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--inner-bg);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .display-area {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--inner-bg);
            border-radius: 16px;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        #targetChar {
            font-size: 4rem;
            font-weight: 800;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .display-area.correct {
            border-color: var(--correct-color);
            background: rgba(34, 197, 94, 0.15);
        }

        .display-area.wrong {
            border-color: var(--wrong-color);
            background: rgba(239, 68, 68, 0.15);
            animation: shake 0.2s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
        }

        button {
            flex: 1;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #startButton {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        #startButton:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        #resetButton {
            background-color: var(--inner-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        #resetButton:hover:not(:disabled) {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        #statusMessage {
            margin-top: 1rem;
            font-size: 0.875rem;
            height: 1.25rem;
            color: var(--text-sub);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 320px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.9);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.25rem;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
        }

        .modal-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 영문 테마 토글 버튼 -->
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <span id="themeIcon">☀️</span> <span id="themeText">Light</span>
        </button>

        <h1>타자 속도 측정</h1>
        <p class="instruction">화면에 표시되는 문자를 빠르게 입력하세요<br>(대소문자 구분)</p>

        <!-- 영문 시간 단위(s) 버튼 -->
        <div class="time-select-group">
            <button class="time-btn" onclick="selectTime(10)">10s</button>
            <button class="time-btn active" onclick="selectTime(20)">20s</button>
            <button class="time-btn" onclick="selectTime(30)">30s</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">점수</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">남은 시간</div>
                <div class="stat-value" id="timer">20s</div>
            </div>
        </div>

        <div class="display-area" id="displayArea">
            <div id="targetChar">-</div>
        </div>

        <div class="button-group">
            <button id="startButton" onclick="startGame()">게임 시작</button>
            <button id="resetButton" onclick="resetGame()">초기화</button>
        </div>

        <div id="statusMessage">시작 버튼을 눌러주세요</div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-title">게임 종료!</div>
            <div class="modal-score"><span id="finalScore">0</span>점</div>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        let selectedTime = 20;
        let score = 0;
        let timeLeft = 20;
        let gameInterval = null;
        let isGameRunning = false;

        const targetCharElement = document.getElementById('targetChar');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const displayArea = document.getElementById('displayArea');
        const startButton = document.getElementById('startButton');
        const statusMessage = document.getElementById('statusMessage');
        const resultModal = document.getElementById('resultModal');
        const finalScoreElement = document.getElementById('finalScore');
        const timeButtons = document.querySelectorAll('.time-btn');

        function toggleTheme() {
            const htmlTag = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            if (htmlTag.getAttribute('data-theme') === 'dark') {
                htmlTag.setAttribute('data-theme', 'light');
                themeIcon.innerText = '🌙';
                themeText.innerText = 'Dark';
            } else {
                htmlTag.setAttribute('data-theme', 'dark');
                themeIcon.innerText = '☀️';
                themeText.innerText = 'Light';
            }
        }

        function selectTime(seconds) {
            if (isGameRunning) return;

            selectedTime = seconds;
            timeLeft = seconds;
            timerElement.innerText = `${timeLeft}s`;

            timeButtons.forEach(btn => {
                if (parseInt(btn.innerText) === seconds) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function setTimeButtonsDisabled(disabled) {
            timeButtons.forEach(btn => btn.disabled = disabled);
        }

        function getRandomChar() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function setNewTargetChar() {
            targetCharElement.innerText = getRandomChar();
        }

        function triggerFeedback(type) {
            displayArea.classList.remove('correct', 'wrong');
            void displayArea.offsetWidth;
            displayArea.classList.add(type);
            
            setTimeout(() => {
                displayArea.classList.remove('correct', 'wrong');
            }, 200);
        }

        function checkInput(event) {
            if (event.key.length > 1) return;

            const inputChar = event.key;
            
            if (inputChar === targetCharElement.innerText) {
                score += 10;
                triggerFeedback('correct');
            } else {
                score = Math.max(0, score - 5);
                triggerFeedback('wrong');
            }

            scoreElement.innerText = score;
            setNewTargetChar();
        }

        function updateTimer() {
            timeLeft--;
            timerElement.innerText = `${timeLeft}s`;

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function endGame() {
            clearInterval(gameInterval);
            document.removeEventListener('keydown', checkInput);
            
            isGameRunning = false;
            startButton.disabled = false;
            setTimeButtonsDisabled(false);
            targetCharElement.innerText = '-';
            statusMessage.innerText = '';

            finalScoreElement.innerText = score;
            resultModal.classList.add('active');
        }

        function closeModal() {
            resultModal.classList.remove('active');
        }

        function startGame() {
            if (isGameRunning) return;
            
            closeModal();
            isGameRunning = true;
            startButton.disabled = true;
            setTimeButtonsDisabled(true);
            
            score = 0;
            timeLeft = selectedTime;
            
            scoreElement.innerText = score;
            timerElement.innerText = `${timeLeft}s`;
            statusMessage.innerText = '';
            
            setNewTargetChar();

            gameInterval = setInterval(updateTimer, 1000);
            document.addEventListener('keydown', checkInput);
        }

        function resetGame() {
            clearInterval(gameInterval);
            document.removeEventListener('keydown', checkInput);
            closeModal();
            
            isGameRunning = false;
            startButton.disabled = false;
            setTimeButtonsDisabled(false);
            
            score = 0;
            timeLeft = selectedTime;
            
            scoreElement.innerText = '0';
            timerElement.innerText = `${timeLeft}s`;
            targetCharElement.innerText = '-';
            statusMessage.innerText = '시작 버튼을 눌러주세요';
        }
    </script>
</body>
</html>
